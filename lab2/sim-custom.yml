# RTL Simulation Variables
sim.inputs:
  input_files:
    - "src/EECS151.sv"
    - "src/Q1a.sv"  
    - "src/Q1a_tb.sv"  #TODO fill out with custom testbench file
  timescale: "1ns/10ps"
  options:
    - "-notice"
    - "-line"
    - "+lint=all,noVCDE"
    - "+v2k"
    - "-debug_access+all"
    - "-kdb"
    - "-sverilog"
  top_module: dut #TODO name of DUT module
  tb_name: Q1a_tb #TODO name of tb
  defines: 
    - "CLOCK_PERIOD=1.00"
  defines_meta: append